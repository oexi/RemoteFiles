name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Restore Xcode build cache
        uses: actions/cache@v4
        with:
          path: .derivedData
          key: ios-derived-${{ runner.arch }}-${{ hashFiles('project.yml') }}

      - name: Resolve Swift packages
        run: |
          set -o pipefail
          xcodebuild \
            -resolvePackageDependencies \
            -project RemoteFiles.xcodeproj \
            -scheme RemoteFiles \
            -derivedDataPath .derivedData \
            | tee resolve-packages.log

      - name: Select simulator
        id: simulator
        run: |
          set -euo pipefail
          UDID="$(python3 - <<'PY'
          import json
          import subprocess

          payload = json.loads(subprocess.check_output([
              "xcrun", "simctl", "list", "devices", "available", "--json"
          ]))

          for runtime, devices in payload.get("devices", {}).items():
              if "iOS-26" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)

          raise SystemExit("No available iPhone Simulator found")
          PY
          )"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator $UDID"

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project RemoteFiles.xcodeproj \
            -scheme RemoteFiles \
            -configuration Debug \
            -derivedDataPath .derivedData \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build \
            | tee build.log

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -project RemoteFiles.xcodeproj \
            -scheme RemoteFiles \
            -configuration Debug \
            -derivedDataPath .derivedData \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test \
            | tee test.log

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ci-logs
          path: |
            resolve-packages.log
            build.log
            test.log
          if-no-files-found: ignore
