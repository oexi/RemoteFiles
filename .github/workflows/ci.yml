name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_MAJOR: "27"
  IOS_SIMULATOR_MAJOR: "27"

jobs:
  build-and-test:
    name: Build and test (iOS Simulator)
    # macOS host image that ships Xcode 27 and the iOS 27 Simulator runtime.
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select and verify Xcode
        run: |
          set -euo pipefail
          VERSION_OUTPUT="$(xcodebuild -version)"
          CURRENT="${VERSION_OUTPUT%%$'\n'*}"
          if ! grep -Eq "^Xcode ${XCODE_MAJOR}([.]|\$)" <<< "$CURRENT"; then
            XCODE_APP="$(find /Applications -maxdepth 1 -type d -name "Xcode_${XCODE_MAJOR}*.app" -print | sort -V | tail -n 1)"
            if [ -z "$XCODE_APP" ]; then
              echo "Xcode ${XCODE_MAJOR} is required but was not found." >&2
              printf '%s\n' "$VERSION_OUTPUT" >&2
              exit 1
            fi
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
            VERSION_OUTPUT="$(xcodebuild -version)"
            CURRENT="${VERSION_OUTPUT%%$'\n'*}"
          fi
          printf '%s\n' "$VERSION_OUTPUT" | tee xcode-version.log
          grep -Eq "^Xcode ${XCODE_MAJOR}([.]|\$)" <<< "$CURRENT"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Restore Xcode build cache
        uses: actions/cache@v4
        with:
          path: .derivedData
          key: derived-data-xcode${{ env.XCODE_MAJOR }}-${{ runner.arch }}-${{ hashFiles('project.yml') }}
          restore-keys: |
            derived-data-xcode${{ env.XCODE_MAJOR }}-${{ runner.arch }}-

      - name: Resolve Swift packages
        run: |
          set -o pipefail
          xcodebuild \
            -resolvePackageDependencies \
            -project RemoteFiles.xcodeproj \
            -scheme RemoteFiles \
            -derivedDataPath .derivedData \
            | tee resolve-packages.log

      - name: Select iOS Simulator
        id: simulator
        run: |
          set -euo pipefail
          UDID="$(python3 - <<'PY'
          import json
          import os
          import subprocess

          payload = json.loads(subprocess.check_output([
              "xcrun", "simctl", "list", "devices", "available", "--json"
          ]))

          for runtime, devices in payload.get("devices", {}).items():
              if f"iOS-{os.environ['IOS_SIMULATOR_MAJOR']}-" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)

          raise SystemExit(f"No available iOS {os.environ['IOS_SIMULATOR_MAJOR']} iPhone Simulator found")
          PY
          )"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator $UDID"

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project RemoteFiles.xcodeproj \
            -scheme RemoteFiles \
            -configuration Debug \
            -derivedDataPath .derivedData \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build-for-testing \
            | tee build.log

      - name: Verify File Provider extension metadata
        run: |
          set -euo pipefail
          APP=".derivedData/Build/Products/Debug-iphonesimulator/RemoteFiles.app"
          EXT=".derivedData/Build/Products/Debug-iphonesimulator/RemoteFiles.app/PlugIns/RemoteFilesFileProvider.appex"
          test -f "$APP/Assets.car"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles' "$APP/Info.plist" | grep -F 'AppIcon'
          compgen -G "$APP/AppIcon*.png" >/dev/null
          test -d "$EXT"
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$EXT/Info.plist" | grep -Fx 'com.apple.fileprovider-nonui'
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPrincipalClass' "$EXT/Info.plist" | grep -F 'FileProviderExtension'
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionAttributes:NSExtensionFileProviderSupportsEnumeration' "$EXT/Info.plist" | grep -Fx 'true'
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionAttributes:NSExtensionFileProviderDocumentGroup' "$EXT/Info.plist" | grep -Fx 'group.com.oexi.RemoteFiles'

      - name: Boot iOS Simulator
        run: |
          set -euo pipefail
          xcrun simctl shutdown all || true
          xcrun simctl boot "${{ steps.simulator.outputs.udid }}" || true

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -project RemoteFiles.xcodeproj \
            -scheme RemoteFiles \
            -configuration Debug \
            -derivedDataPath .derivedData \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            -only-testing:RemoteFilesTests \
            test-without-building \
            | tee test.log

      - name: Run UI launch test
        run: |
          set -o pipefail
          xcodebuild \
            -project RemoteFiles.xcodeproj \
            -scheme RemoteFiles \
            -configuration Debug \
            -derivedDataPath .derivedData \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -parallel-testing-enabled NO \
            -only-testing:RemoteFilesUITests/LaunchTests/testLaunches \
            test-without-building \
            | tee ui-smoke.log

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            resolve-packages.log
            build.log
            test.log
            ui-smoke.log
            xcode-version.log
          if-no-files-found: ignore
