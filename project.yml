name: RemoteFiles
options:
  bundleIdPrefix: com.oexi
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.9
    CURRENT_PROJECT_VERSION: 25
    MARKETING_VERSION: 0.4.2
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: RemoteFiles
    INFOPLIST_KEY_CFBundleShortVersionString: "$(MARKETING_VERSION)"
    INFOPLIST_KEY_CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    INFOPLIST_KEY_CFBundleIconName: AppIcon
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
    INFOPLIST_KEY_UIFileSharingEnabled: YES
    INFOPLIST_KEY_NSFaceIDUsageDescription: RemoteFiles uses Face ID to unlock the app when the app lock is on.
    PRODUCT_BUNDLE_IDENTIFIER: com.oexi.RemoteFiles
packages:
  Runestone:
    url: https://github.com/simonbs/Runestone.git
    revision: 592434a103a4d1ab83e14f87ac6eef569dd7a99d
  SMBClient:
    url: https://github.com/oexi/SMBClient.git
    revision: cda497004018fa1384968c9ffea1236a0fc141f3
  NFSKit:
    url: https://github.com/oexi/NFSKit.git
    revision: b87f5587e1514899fa8ed383300b53ece35f4437
  FilesProvider:
    url: https://github.com/oexi/FileProvider.git
    revision: 1c5248020bd9274f1ccd6b4147c25fa323c60930
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    revision: ae8562f895de06ccb86fdb1cbb65fd99c8976e12
  SwiftCrypto:
    url: https://github.com/apple/swift-crypto.git
    revision: e8d6eba1fef23ae5b359c46b03f7d94be2f41fed
  NIOSSH:
    url: https://github.com/Wellz26/swift-nio-ssh.git
    revision: b93961a2988607a756cbc21a811f406f27aa9ab6
  SwiftNIO:
    url: https://github.com/apple/swift-nio.git
    revision: c51907a839e63ebf0ba2076bba73dd96436bd1b9
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    revision: d17566fdcb293c2d2304c6b445dd729dd66d470e
  SWCompression:
    url: https://github.com/tsolomko/SWCompression.git
    revision: 36f068e4ffa929f23aec8dde065a9b365fbf0688
  LibArchive:
    url: https://github.com/everpcpc/libarchive-swift.git
    revision: 69a947c0e5bf4e940a6ac998a8fab3165d5b97f6
  TreeSitterLanguages:
    url: https://github.com/simonbs/TreeSitterLanguages.git
    revision: 15cf3a9ec3ab95e0d058b7df9f35619123c9e02d
targets:
  RemoteFiles:
    type: application
    platform: iOS
    sources:
      - path: RemoteFiles
        excludes:
          - Resources
          - Info.plist
      - path: RemoteFiles/Resources
    settings:
      base:
        # Holds only keys that have no INFOPLIST_KEY_ build setting (NSBonjourServices);
        # Xcode merges it with the generated Info.plist.
        INFOPLIST_FILE: RemoteFiles/Info.plist
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: RemoteFiles looks for file servers on your local network so you can add them quickly.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: RemoteFiles/RemoteFiles.entitlements
        ENABLE_PREVIEWS: YES
    dependencies:
      - target: RemoteFilesFileProvider
      - package: Runestone
      - package: SMBClient
      - package: NFSKit
      - package: FilesProvider
      - package: Citadel
      - package: SwiftCrypto
        product: Crypto
      - package: NIOSSH
        product: NIOSSH
      - package: SwiftNIO
        product: NIOCore
      - package: ZIPFoundation
      - package: SWCompression
      - package: LibArchive
      - package: TreeSitterLanguages
        product: TreeSitterBashRunestone
      - package: TreeSitterLanguages
        product: TreeSitterCRunestone
      - package: TreeSitterLanguages
        product: TreeSitterCPPRunestone
      - package: TreeSitterLanguages
        product: TreeSitterCSSRunestone
      - package: TreeSitterLanguages
        product: TreeSitterGoRunestone
      - package: TreeSitterLanguages
        product: TreeSitterHTMLRunestone
      - package: TreeSitterLanguages
        product: TreeSitterJavaRunestone
      - package: TreeSitterLanguages
        product: TreeSitterJavaScriptRunestone
      - package: TreeSitterLanguages
        product: TreeSitterJSONRunestone
      - package: TreeSitterLanguages
        product: TreeSitterMarkdownRunestone
      - package: TreeSitterLanguages
        product: TreeSitterPHPRunestone
      - package: TreeSitterLanguages
        product: TreeSitterPythonRunestone
      - package: TreeSitterLanguages
        product: TreeSitterRustRunestone
      - package: TreeSitterLanguages
        product: TreeSitterSQLRunestone
      - package: TreeSitterLanguages
        product: TreeSitterSwiftRunestone
      - package: TreeSitterLanguages
        product: TreeSitterTOMLRunestone
      - package: TreeSitterLanguages
        product: TreeSitterTypeScriptRunestone
      - package: TreeSitterLanguages
        product: TreeSitterTSXRunestone
      - package: TreeSitterLanguages
        product: TreeSitterYAMLRunestone

  RemoteFilesFileProvider:
    type: app-extension
    platform: iOS
    info:
      path: RemoteFilesFileProvider/Info.plist
      properties:
        CFBundleDisplayName: RemoteFiles
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).FileProviderExtension"
          NSExtensionAttributes:
            NSExtensionFileProviderDocumentGroup: group.com.oexi.RemoteFiles
            NSExtensionFileProviderSupportsEnumeration: true
    sources:
      - path: RemoteFilesFileProvider
        excludes:
          - Info.plist
          - RemoteFilesFileProvider.entitlements
      - path: RemoteFiles/Core
        excludes:
          - TransferEngine.swift
      - path: RemoteFiles/Models
      - path: RemoteFiles/Providers
      - path: RemoteFiles/App/AppVersion.swift
      - path: RemoteFiles/Services/CredentialVault.swift
      - path: RemoteFiles/Services/SSHHostKeyStore.swift
      - path: RemoteFiles/Services/WindowsSecurityDescriptorParser.swift
    dependencies:
      - package: SMBClient
      - package: NFSKit
      - package: FilesProvider
      - package: Citadel
      - package: SwiftCrypto
        product: Crypto
      - package: NIOSSH
        product: NIOSSH
      - package: SwiftNIO
        product: NIOCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oexi.RemoteFiles.FileProvider
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: RemoteFilesFileProvider/RemoteFilesFileProvider.entitlements
        SKIP_INSTALL: YES

  RemoteFilesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RemoteFilesTests
    dependencies:
      - target: RemoteFiles
  RemoteFilesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RemoteFilesUITests
    dependencies:
      - target: RemoteFiles
